name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python files
        run: python -m compileall -q gui.py download.py cleanup_downloads.py tests
      - name: Run offline tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest tests.test_gui tests.test_archive_handling tests.test_cleanup_downloads tests.test_filename_limit tests.test_download.TestIgnoreErrorsByContentType -q
      - name: Check Unix launchers
        if: runner.os != 'Windows'
        run: sh -n "Start Downloader.sh" && sh -n "Start Downloader.command"
